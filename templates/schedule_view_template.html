<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2196F3">
    <title>ЯГК Schedule</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333333);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .lesson-card {
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
        }
        .lesson-default {
            border-left: 3px solid #2196F3;
        }
        .lesson-replaced {
            border-left: 3px solid #FF9800;
            background-color: #fff8e1;
        }
        .lesson-canceled {
            border-left: 3px solid #f44336;
            background-color: #ffebee;
            opacity: 0.7;
        }
        input, button {
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body class="min-h-screen p-3">
    <div class="max-w-lg mx-auto">
        <div class="bg-white rounded-lg shadow-sm p-4 mb-3">
            <h1 class="text-xl font-semibold text-center mb-4">Расписание</h1>

            <div class="mb-3">
                <label class="block text-xs font-medium mb-1 text-gray-500">Группа</label>
                <input
                    type="text"
                    id="groupInput"
                    placeholder="Например: ИС1-11"
                    class="w-full px-3 py-2 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                >
            </div>

            <div class="mb-3">
                <label class="block text-xs font-medium mb-1 text-gray-500">Дата</label>
                <input
                    type="date"
                    id="dateInput"
                    class="w-full px-3 py-2 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                >
            </div>

            <div class="flex gap-2 mb-2">
                <button
                    onclick="loadSchedule()"
                    class="flex-1 bg-blue-500 text-white px-3 py-2 hover:bg-blue-600 transition-colors"
                >
                    Показать
                </button>
                <button
                    onclick="loadToday()"
                    class="flex-1 bg-gray-500 text-white px-3 py-2 hover:bg-gray-600 transition-colors"
                >
                    Сегодня
                </button>
            </div>
        </div>

        <div id="scheduleContainer"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        document.getElementById('dateInput').valueAsDate = new Date();

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        function loadToday() {
            document.getElementById('dateInput').valueAsDate = new Date();
            loadSchedule();
        }

        async function loadSchedule() {
            const group = document.getElementById('groupInput').value.trim();
            const dateInput = document.getElementById('dateInput').value;
            
            if (!group) {
                alert('Введите название группы');
                return;
            }

            const date = new Date(dateInput);
            const dateStr = formatDate(date);

            try {
                const response = await fetch(`/api/schedule?group=${encodeURIComponent(group)}&date=${encodeURIComponent(dateStr)}`);
                const data = await response.json();

                if (response.ok) {
                    displaySchedule(data);
                    localStorage.setItem('favorite_group', group);
                } else {
                    alert('Ошибка: ' + (data.error || 'Не удалось загрузить расписание'));
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            }
        }

        function displaySchedule(data) {
            const container = document.getElementById('scheduleContainer');

            if (data.is_weekend) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                        <h2 class="text-lg font-semibold mb-2">${data.date}</h2>
                        <p class="text-gray-500">Выходной день</p>
                    </div>
                `;
                return;
            }

            if (data.lessons.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                        <h2 class="text-lg font-semibold mb-2">${data.date}</h2>
                        <p class="text-gray-500">Нет пар</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h2 class="text-lg font-semibold mb-3 text-center">${data.date}</h2>
                    <div class="space-y-2">
            `;

            data.lessons.forEach((lesson, index) => {
                let colorClass = 'lesson-default';
                let emoji = '';

                if (lesson.is_canceled) {
                    colorClass = 'lesson-canceled';
                    emoji = '❌';
                } else if (lesson.is_replaced) {
                    colorClass = 'lesson-replaced';
                    emoji = '⚠️';
                }

                html += `
                    <div class="lesson-card ${colorClass}">
                        <div class="flex items-start gap-2">
                            <div class="text-lg flex-shrink-0">${emoji}</div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm text-gray-500">${lesson.pair_number} пара · ${lesson.time}</div>
                                <div class="font-medium text-sm mt-0.5">${lesson.subject}</div>
                                ${lesson.teacher ? `<div class="text-xs text-gray-600 mt-0.5">${lesson.teacher}</div>` : ''}
                                ${lesson.room ? `<div class="text-xs text-gray-600">${lesson.room}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function addToFavorites() {
            const group = document.getElementById('groupInput').value.trim();
            if (!group) {
                alert('Введите название группы');
                return;
            }
            localStorage.setItem('favorite_group', group);
            alert('✅ Группа добавлена в избранное!');
        }

        window.addEventListener('load', () => {
            const favoriteGroup = localStorage.getItem('favorite_group');
            if (favoriteGroup) {
                document.getElementById('groupInput').value = favoriteGroup;
            }
        });

        if (tg) {
            tg.BackButton.onClick(() => {
                window.history.back();
            });
        }
    </script>
</body>
</html>
