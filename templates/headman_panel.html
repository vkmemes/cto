<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headman Panel - ЯГК</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333333);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        input, textarea, button {
            border-radius: 6px;
            font-size: 14px;
        }
        .student-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 12px;
            background-color: #ffffff;
        }
        .student-card.sick {
            background-color: #ffebee;
            border-color: #f44336;
        }
    </style>
</head>
<body class="min-h-screen p-3">
    <div class="max-w-lg mx-auto">
        <div class="bg-white rounded-lg shadow-sm p-4 mb-3">
            <h1 class="text-xl font-semibold text-center mb-4">Панель старосты</h1>

            <div class="mb-3">
                <label class="block text-xs font-medium mb-1 text-gray-500">Группа</label>
                <input
                    type="text"
                    id="groupInput"
                    placeholder="Название группы"
                    class="w-full px-3 py-2 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                >
            </div>

            <div class="mb-3">
                <label class="block text-xs font-medium mb-1 text-gray-500">PIN-код</label>
                <input
                    type="password"
                    id="pinInput"
                    placeholder="Введите PIN"
                    class="w-full px-3 py-2 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                >
            </div>

            <button
                onclick="loadData()"
                class="w-full bg-blue-500 text-white px-3 py-2 hover:bg-blue-600 transition-colors mb-4"
            >
                Загрузить данные
            </button>

            <div id="dataContainer"></div>

            <div class="mt-4 border-t pt-4">
                <h2 class="text-lg font-semibold mb-3">Отправить сообщение группе</h2>
                <textarea
                    id="messageInput"
                    rows="3"
                    placeholder="Введите сообщение..."
                    class="w-full px-3 py-2 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-3"
                ></textarea>
                <button
                    onclick="sendMessage()"
                    class="w-full bg-gray-500 text-white px-3 py-2 hover:bg-gray-600 transition-colors"
                >
                    Отправить
                </button>
            </div>

            <div id="statusMessage" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let studentsData = [];

        async function loadData() {
            const group = document.getElementById('groupInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();

            if (!group || !pin) {
                showStatus('❌ Введите группу и PIN', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/headman?group=${encodeURIComponent(group)}&pin=${encodeURIComponent(pin)}`);
                const data = await response.json();

                if (response.ok) {
                    studentsData = data.students;
                    displayData(data);
                    
                    localStorage.setItem('headman_group', group);
                    localStorage.setItem('headman_pin', pin);
                } else {
                    showStatus('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
            }
        }

        function displayData(data) {
            const container = document.getElementById('dataContainer');

            let html = '<div class="space-y-3">';

            html += '<div class="student-card">';
            html += '<h3 class="font-semibold text-sm mb-2">Студенты</h3>';
            html += '<div class="space-y-1">';

            data.students.forEach(student => {
                const isOnDuty = student.user_id === data.current_duty_id;
                const sickClass = student.is_sick ? 'sick' : '';
                const badges = [];

                if (student.is_headman) badges.push('<span class="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">староста</span>');
                if (student.is_sick) badges.push('<span class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded">болен</span>');
                if (isOnDuty) badges.push('<span class="text-xs bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded">дежурный</span>');

                html += `
                    <div class="student-card ${sickClass} flex justify-between items-center">
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate">${student.full_name}</div>
                            ${badges.length ? `<div class="text-xs mt-0.5">${badges.join(' ')}</div>` : ''}
                        </div>
                        <div class="flex gap-1 ml-2">
                            <button
                                onclick="setDuty(${student.user_id})"
                                class="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded hover:bg-gray-200"
                                title="Дежурный"
                            >
                                📌
                            </button>
                            <button
                                onclick="toggleSick(${student.user_id}, ${!student.is_sick})"
                                class="text-xs ${student.is_sick ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} px-2 py-1 rounded hover:opacity-80"
                                title="${student.is_sick ? 'Здоров' : 'Болен'}"
                            >
                                ${student.is_sick ? '✓' : '🤒'}
                            </button>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            html += '</div>';

            html += '<div class="student-card">';
            html += '<h3 class="font-semibold text-sm mb-2">Статистика</h3>';
            html += `<div class="text-xs text-gray-600">Студентов: ${data.students.length} · Больных: ${data.students.filter(s => s.is_sick).length}</div>`;
            html += `<div class="text-xs text-gray-600">${data.notify_enabled ? '✓ Уведомления включены' : '✗ Уведомления выключены'}</div>`;
            html += '</div>';

            html += '</div>';

            container.innerHTML = html;
        }

        async function setDuty(userId) {
            const group = document.getElementById('groupInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();

            if (!group || !pin) {
                showStatus('❌ Введите группу и PIN', 'error');
                return;
            }

            try {
                const response = await fetch('/api/headman', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        group: group,
                        pin: pin,
                        action: 'set_duty',
                        user_id: userId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('✅ Дежурный назначен!', 'success');
                    setTimeout(() => loadData(), 1000);
                } else {
                    showStatus('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
            }
        }

        async function toggleSick(userId, isSick) {
            const group = document.getElementById('groupInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();

            if (!group || !pin) {
                showStatus('❌ Введите группу и PIN', 'error');
                return;
            }

            try {
                const response = await fetch('/api/headman', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        group: group,
                        pin: pin,
                        action: 'set_sick',
                        user_id: userId,
                        is_sick: isSick
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('✅ Статус обновлен!', 'success');
                    setTimeout(() => loadData(), 1000);
                } else {
                    showStatus('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
            }
        }

        async function sendMessage() {
            const group = document.getElementById('groupInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();
            const message = document.getElementById('messageInput').value.trim();

            if (!group || !pin || !message) {
                showStatus('❌ Заполните все поля', 'error');
                return;
            }

            try {
                const response = await fetch('/api/headman', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        group: group,
                        pin: pin,
                        action: 'send_message',
                        message: message
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(`✅ Сообщение отправлено (${data.sent_count} получателей)`, 'success');
                    document.getElementById('messageInput').value = '';
                } else {
                    showStatus('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `mt-4 text-center p-3 rounded ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            
            setTimeout(() => {
                statusDiv.textContent = '';
                statusDiv.className = 'mt-4 text-center';
            }, 3000);
        }

        window.addEventListener('load', () => {
            const savedGroup = localStorage.getItem('headman_group');
            const savedPin = localStorage.getItem('headman_pin');
            
            if (savedGroup) {
                document.getElementById('groupInput').value = savedGroup;
            }
            if (savedPin) {
                document.getElementById('pinInput').value = savedPin;
            }
        });

        if (tg) {
            tg.BackButton.onClick(() => {
                window.history.back();
            });
        }
    </script>
</body>
</html>
